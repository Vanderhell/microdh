name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMDH_BUILD_TESTS=ON \
            -DMDH_BUILD_INTERNAL_TESTS=ON \
            -DMDH_BUILD_DIFFERENTIAL_TESTS=OFF \
            -DMDH_BUILD_SLOW_TESTS=OFF \
            -DMDH_STRICT_WARNINGS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install
        run: cmake --install build --prefix release-root

      - name: Create archive
        run: |
          mkdir -p release
          tar -C release-root -czf release/microdh-${{ github.ref_name }}.tar.gz .
          zip -r release/microdh-${{ github.ref_name }}.zip release-root

      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/microdh-${{ github.ref_name }}.tar.gz
            release/microdh-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
