name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC Debug
            os: ubuntu-latest
            cc: gcc
            build_type: Debug
            strict: ON
            internal: ON
            differential: ON
            slow: OFF
          - name: Ubuntu GCC Release
            os: ubuntu-latest
            cc: gcc
            build_type: Release
            strict: ON
            internal: ON
            differential: ON
            slow: OFF
          - name: Ubuntu Clang Debug
            os: ubuntu-latest
            cc: clang
            build_type: Debug
            strict: ON
            internal: ON
            differential: ON
            slow: OFF
          - name: Windows MSVC Debug
            os: windows-latest
            build_type: Debug
            strict: ON
            internal: ON
            differential: OFF
            slow: OFF
          - name: macOS Clang Release
            os: macos-latest
            cc: clang
            build_type: Release
            strict: ON
            internal: ON
            differential: OFF
            slow: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build \
            -DMDH_BUILD_TESTS=ON \
            -DMDH_BUILD_INTERNAL_TESTS=ON \
            -DMDH_BUILD_DIFFERENTIAL_TESTS=${{ matrix.differential }} \
            -DMDH_BUILD_SLOW_TESTS=${{ matrix.slow }} \
            -DMDH_STRICT_WARNINGS=${{ matrix.strict }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }})
          if [ -n "${{ matrix.cc }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }})
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

  sanitize:
    name: Ubuntu Clang ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMDH_BUILD_TESTS=ON \
            -DMDH_BUILD_INTERNAL_TESTS=ON \
            -DMDH_BUILD_DIFFERENTIAL_TESTS=OFF \
            -DMDH_BUILD_SLOW_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumer:
    name: Consumer Install Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMDH_BUILD_TESTS=ON \
            -DMDH_BUILD_INTERNAL_TESTS=OFF \
            -DMDH_BUILD_DIFFERENTIAL_TESTS=OFF \
            -DMDH_BUILD_SLOW_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -R mdh_consumer_smoke
